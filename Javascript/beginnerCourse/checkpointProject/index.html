<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Horoscope</title>
    <!-- Link the external CSS stylesheet for page styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Element that handles the Vanta fog background effect animation -->
<div id="fog"></div>


<main class="content">
    <h1>YOUR HOROSCOPE</h1>

    <!-- Inner container to vertically group the form elements together -->
    <div class="horoscope-content">
        <p>Discover what the universe has in store for you.</p>
        <h2>Enter your birthday</h2>

        <!-- Input field that allows the user to select or type a date -->
        <input type="date">
        <!-- Trigger button that starts the horoscope calculation process -->
        <button id="reveal-btn">Reveal My Horoscope</button>
    </div>
</main>

<!-- Standalone container element used to generate and inject the stars -->
<div id="stars"></div>

<!-- External 3D library required for the background animations to function -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<!-- External plugin file used to create the specific Vanta fog effect -->
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js"></script>

<script src="script.js"></script>

</body>
</html>
