<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro App</title>
    <!-- Link the external CSS stylesheet for page styling -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<video id="openingVideo" class="background-video is-visible" muted preload="auto">
    <source src="background/openingScene.mp4" type="video/mp4">
</video>

<video id="bgVideo" class="background-video" muted loop preload="auto">
    <source src="background/background.mp4" type="video/mp4">
</video>

<main class="content">
    <section id="first-page">
        <h1>
            <svg viewBox="10 110 1200 400" class="text-curve-svg">
                <path id="road-curve" d="M -200,550 C 400,60 700,15 1380,500" fill="none" />
                <text>
                    <textPath href="#road-curve" startOffset="50%" text-anchor="middle">
                        are you ready for the long road?
                    </textPath>
                </text>
            </svg>
        </h1>

        <!-- Inner container to vertically group the form elements together -->
        <div class="pomodoro-container">
            <p>every journey begins with a single step.</p>

            <!-- Trigger button that brings you to the next page -->
            <button id="next-page-btn">begin the journey</button>
        </div>
    </section>

    <section id="second-page" class="hidden">
        <div class="pomodoro-container">
            <!-- Shows a short status message for the user. -->
            <div class="app-message">press start to begin</div>

            <!-- Timer circle -->
            <!-- Holds the circle design, timer text, and start button. -->
            <div class="app-circle">
                <!-- Creates the visual circle around the timer. -->
                <div class="circle-shape">
                    <!-- Covers the right side of the circle. -->
                    <div class="semi-circle right-side circle-mask"></div>
                    <!-- Shows the right colored side of the circle. -->
                    <div class="semi-circle right-side circle"></div>
                    <!-- Covers the left side of the circle. -->
                    <div class="semi-circle left-side circle-mask"></div>
                    <!-- Shows the left colored side of the circle. -->
                    <div class="semi-circle left-side circle"></div>
                </div>

                <!-- Timer text -->
                <!-- Shows the minutes and seconds. -->
                <div class="timer-display">
                    <p><span class="minutes">25</span>:<span class="seconds">00</span></p>
                </div>

                <!-- Button -->
                <!-- Starts the Pomodoro timer. -->
                <button class="start-btn">start</button>
            </div>

            <!-- Button to go back to the home page -->
            <button id="back-btn">Back</button>
        </div>
    </section>
</main>


<script src="./js/app.js"></script>
</body>
</html>
