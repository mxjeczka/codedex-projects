<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro App</title>
    <!-- Main stylesheet bundle. -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

<!-- Background video: "AI Generated Dreamy Waterfall In Deep Jungle" by eQuinox Studio, found and downloaded from Vecteezy. -->
<!-- Source: https://www.vecteezy.com/video/40858391-ai-generated-dreamy-waterfall-in-deep-jungle -->
<video id="bgVideo" class="background-video" muted loop preload="auto">
    <source src="resources/background/background.mp4" type="video/mp4">
</video>

<!-- Background music: "Shrouded from human sight, elves of the forest have congregated here for centuries." found and downloaded from Tabletop Audio. -->
<!-- Source: https://tabletopaudio.com/ -->
<audio id="backgroundMusic" preload="auto">
    <source src="resources/music/91_Elven_Glade.mp3" type="audio/mpeg">
</audio>

<main class="content">
    <!-- Home page with timer controls. -->
    <section id="home-page">
        <div class="pomodoro-container">
            <img id="image" src="resources/images/lortRing.png" alt="">

            <!-- Timer display. -->
            <div class="timer-display">
                <p><span class="minutes">25</span>:<span class="seconds">00</span></p>
            </div>

            <!-- Custom minute input. -->
            <div class="timer-settings" aria-label="timer settings">
                <label class="custom-time">
                    <span>min</span>
                    <input id="custom-minutes" type="number" min="1" max="59" value="25">
                </label>
            </div>

            <div class="timer-actions">
                <button class="start-btn" type="button">start</button>
                <button class="stop-btn" type="button">stop</button>
                <button class="reset-btn" type="button">reset</button>
            </div>

            <!-- Music toggle. -->
            <button id="music-btn" type="button" aria-label="Turn music on">
                <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                    <path d="M23 9l-6 6M17 9l6 6"></path>
                </svg>

                <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
            </button>
        </div>
    </section>
</main>


<script src="./js/app.js"></script>
</body>
</html>
